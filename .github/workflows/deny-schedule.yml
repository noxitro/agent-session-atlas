# 依存の既知の脆弱性を毎週見る。新しい advisory はコードを変えなくても出るので、push と PR だけでは気づけない。
# scripts/npm-audit.mjs(npm audit を devDependencies も含めて回し、high 以上で落とす。画面のビルドに使う道具で、その出力が
# レポートの HTML に入るため。push と PR の CI と同じ。npm-audit-ignore.json に理由と外す時を書いた advisory だけは止めない)
# 落ちたら Actions の画面と通知で分かる。直し方は docs/development.md の「依存の検査」。
# 外部の Action はコミット SHA で固定する(ci.yml と同じ)。
name: Dependency audit (weekly)

on:
  schedule:
    # 毎週月曜 0:00 UTC(日本時間 9:00)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # package-lock.json だけを見る(npm ci はしない。スクリプトを動かさない。npm-audit.mjs は node: の標準モジュールだけで動く)
      - run: node scripts/npm-audit.mjs
