# push / PR ごとに型検査・単体テスト・レポートの画面のビルドを回す(ジョブ check)。E2E(テスト時に生成する架空の fixture のみ。ジョブ e2e)・
# 画面の操作(ジョブ ui)・clone した直後と同じ中身を作って atlas.bat と同じ順で動かす確認(ジョブ smoke。npm run smoke =
# scripts/fresh-checkout.ts → scripts/checkout-smoke.ts)は、check と並べて別のジョブで回す(1 つのジョブで順に回すと待ち時間が
# それぞれの和になるため)。文書だけを変えた PR では、この 4 つを飛ばす(ジョブ changes)。
# 手元で同じ順に回すのは npm run ci(docs/development.md の「CI」)。
# fixture は e2e の globalSetup(e2e/global-setup.ts)と checkout-smoke.ts が作るので、ここに生成の手順は要らない。
# 実データ(ATLAS_LIVE)と実 LLM 判定は CI では動かさない。
# 依存の検査: npm は scripts/npm-audit.mjs(devDependencies も含む。毎週の検査と同じ)・npm audit signatures(入れたものの署名)・
# scripts/lockfile.test.ts(npm test。lockfile の取得元と整合性)と、PR では dependency-review(新しく入る・上がる dependencies だけ)。
# 外部の Action はタグの付け替えで中身が変わらないようコミット SHA で固定する(末尾の注記が版。Dependabot が SHA ごと更新する)。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 文書だけを変えた PR では、ビルドとテストのジョブ(check・e2e・ui・smoke)を飛ばす(ci-ok は skipped を通す)。
  # 文書とみなすのは docs/ の下と、どこかの *.md。テストもビルドも、リポジトリの *.md を読まない(読むようにしたら、ここで外す)。
  # main への push と手動の実行では、いつも全部を回す
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      # PR の CI が動かすのは base とマージした結果のコミットで、1 つ目の親が base の先端。親まで取れば PR の変更が出せる
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames: 名前を変えたものは、前の名前(消したもの)も出す(コードを docs/ に移したときに見逃さない)
          files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          echo "$files"
          # 文書でないファイルが 1 つでもあれば(何も出ないときも)回す
          if [ -z "$files" ] || grep -qvE '^docs/|\.md$' <<< "$files"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # 想定利用環境は Windows(atlas.bat)。パス処理の取りこぼしを見るため Linux でも回す
        os: [windows-latest, ubuntu-latest]
        # engines は >=24。下限の 24 と、新しく入れる人が選ぶ現行 LTS の 26(node:sqlite は実験的 API なので版で変わりうる)
        node: [24, 26]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # devDependencies も含めて high 以上で止める(毎週の検査と同じ。画面のビルドの道具の出力はレポートの HTML に入るので、
      # 毎週の検査で止まるものは PR でも止める)。npm-audit-ignore.json に理由と外す時を書いた advisory だけは止めない
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/npm-audit.mjs
      # npm ci で入れたパッケージが、レジストリの署名(と、あれば来歴の attestation)と合うかを見る。
      # lockfile の取得元・整合性ハッシュ・インストール時のスクリプトは npm test の scripts/lockfile.test.ts が見る
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:report

  # E2E(e2e/。テスト時に生成する架空の fixture だけを使う)。CLI と fixture を作る node:sqlite(実験的 API で版で変わりうる)が Node の上で
  # 動くので、Node 24 と 26 で回す。OS ごとに 1 つのジョブで、Node 24 → 26 の順に続けて回す(版ごとにジョブを分けると、npm ci と
  # 画面のビルドを版の数だけ繰り返す)。Node 26 での npm ci と画面のビルドは check が見るので、ここでは Node 24 で入れた node_modules を
  # 使い回す(入れているネイティブのモジュールは Node-API で、版をまたいで動く)。Node 24 で落ちても、26 も回して両方の結果を出す
  e2e:
    name: e2e (${{ matrix.os }}, node 24 + 26)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: build-report
        run: npm run build:report
      - name: e2e (node 24)
        run: npm run e2e
      - id: node26
        if: ${{ !cancelled() && steps.build-report.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: e2e (node 26)
        if: ${{ !cancelled() && steps.node26.outcome == 'success' }}
        run: |
          node --version
          npm run e2e

  # 画面の操作(Playwright の Chromium、ui/)。ブラウザは OS ごとに見れば足りるので Node 24 だけで回す
  ui:
    name: ui (${{ matrix.os }}, node 24)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:report
      # ブラウザの本体は Playwright の版ごとにキャッシュする(ほかの依存が上がっても取り直さない)。保存は main だけ(PR で保存すると、
      # PR ごとにキャッシュができ、リポジトリのキャッシュの上限で main のキャッシュが追い出される)。
      # Linux はブラウザが使う共有ライブラリも入れる(--with-deps。キャッシュがあっても共有ライブラリは入れ直す)
      - id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # 入れた直後に保存する(画面テストが落ちても、ブラウザは取り直さずに済む)
      - if: github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - run: npm run ui
      # 画面テストが落ちたら、その時点の画面(ui/failure-shot.ts が out/ui-failures/ に残す)を成果物として上げる
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-failures-${{ matrix.os }}
          path: out/ui-failures/
          if-no-files-found: ignore
          retention-days: 7

  # clone した状態での動作確認(手元の npm run smoke と同じ。scripts/smoke-local.ts)。OS ごとに Node 24 で回す。
  # root の npm ci は、checkout-smoke.ts が fixture を作るのに使う(yaml)
  smoke:
    name: smoke (${{ matrix.os }}, node 24)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: clone した状態での動作確認
        run: npm run smoke

  # PR で新しく入る・上がる依存に既知の脆弱性が無いかを見る(dependencies だけ。devDependencies は check の scripts/npm-audit.mjs が見る)
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime

  # main のルールで必須にするのはこのジョブだけ(行列の組み合わせやジョブの分け方を変えても、必須チェックの名前を変えずに済む)。
  # 上のどれかが落ちたか取り消されたら落ちる。push では dependency-review が、文書だけの PR では check・e2e・ui・smoke が飛ばされる(skipped)が、それは通す
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, check, e2e, ui, smoke, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }} e2e=${{ needs.e2e.result }} ui=${{ needs.ui.result }} smoke=${{ needs.smoke.result }} dependency-review=${{ needs.dependency-review.result }}"
          test "$FAILED" != "true"
