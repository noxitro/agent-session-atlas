# push / PR ごとに型検査・単体テスト・レポートのビルド・E2E(テスト時に生成する架空の fixture のみ)を回し、
# 最後に clone した直後と同じ中身を作って atlas.bat と同じ順で動かす(npm run smoke = scripts/fresh-checkout.ts → scripts/checkout-smoke.ts)。
# 手元で同じ順に回すのは npm run ci(docs/development.md の「CI」)。
# fixture は e2e の globalSetup(e2e/global-setup.ts)が作るので、ここに生成の手順は要らない。
# 実データ(ATLAS_LIVE)と実 LLM 判定は CI では動かさない。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        # 想定利用環境は Windows(atlas.bat)。パス処理の取りこぼしを見るため Linux でも回す
        os: [windows-latest, ubuntu-latest]
        # engines は >=24。下限の 24 と、新しく入れる人が選ぶ現行 LTS の 26(node:sqlite は実験的 API なので版で変わりうる)
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # package.json の dependencies だけを見る(集計で毎回読み込むもの)。atlas.bat の npm install は devDependencies も入れ、
      # テンプレートが古いときは vite も動くが、devDependencies の警告はここでは止めず Dependabot の PR で追う
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:report
      - run: npm run e2e
      # 画面の操作(Playwright の Chromium、ui/)。ブラウザは OS ごとに見れば足りるので Node 24 だけで回す。
      # ブラウザの本体は Playwright の版ごとにキャッシュする(毎回のダウンロードを省く)。
      # Linux はブラウザが使う共有ライブラリも入れる(--with-deps。キャッシュがあっても共有ライブラリは入れ直す)
      - if: matrix.node == 24
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: matrix.node == 24
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - if: matrix.node == 24
        run: npm run ui
      # 画面テストが落ちたら、その時点の画面(ui/failure-shot.ts が out/ui-failures/ に残す)を成果物として上げる
      - if: failure() && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: ui-failures-${{ matrix.os }}
          path: out/ui-failures/
          if-no-files-found: ignore
          retention-days: 7
      # clone した状態での動作確認(手元の npm run smoke と同じ。scripts/smoke-local.ts)
      - name: clone した状態での動作確認
        run: npm run smoke
