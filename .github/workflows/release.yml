# v* タグを push すると、CI と同じ検査を通したうえで配布用 zip を GitHub Release に添付する。
# zip はソース一式(git archive)にビルド済みのレポートテンプレートを足したもの(scripts/pack-release.ts)。
# 同じ中身を CI が scripts/release-smoke.ts で動かして確かめている。
# 展開して atlas.bat をダブルクリックすれば、初回に npm install してから集計する。
# 書き込み権限は Release を作る publish ジョブだけに渡す(依存のコードが走る npm ci / ビルドとは分ける)。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:report
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="agent-session-atlas-${TAG}"
          node scripts/pack-release.ts "$name" "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && zip -qr "${GITHUB_WORKSPACE}/${name}.zip" "${name}")
      - uses: actions/upload-artifact@v7
        with:
          name: release-zip
          path: agent-session-atlas-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "agent-session-atlas-${TAG}.zip" --title "$TAG" --generate-notes --verify-tag
