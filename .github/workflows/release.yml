# リリース: main に入ったコミットで、配る atlas.exe の中身(scripts/release-shipped.txt)がいちばん新しいリリースのタグから変わっていれば、
# 次の版 v<x.y.z> の atlas.exe を Windows で作り、sha256 と一緒にリリースを作って付ける(タグもこのとき、そのコミットに付く)。
# version を上げる PR も、手でタグを push することも要らない。配る中身が変わっていないコミット(説明書・テスト・スクリプト・ワークフローだけ)では、
# 確かめるだけですぐ終わる。
# 次の版: Cargo.toml の [workspace.package] の version のタグがまだ無く、いちばん新しいタグより大きければ、その版(minor や major を
# 上げたいときは Cargo.toml の version を上げる)。そうでなければ、いちばん新しいタグのパッチ版を 1 つ上げる。
# 実行ファイルの版(atlas --version)は、ビルドのときに環境変数 ATLAS_VERSION で渡す(crates/atlas-cli/build.rs)。
# マージはこのワークフローを待たない(マージの条件は CI の ci-ok だけ)。起動用の .bat と自動で送るタスクの自動の更新は、配る中身が変わったのに
# リリースがまだ無いコミットには進まず、リリースのタグが届いてから取り込む(crates/atlas-cli/src/self_update.rs)。手で git pull した利用者は、
# 前のタグのリリースの atlas.exe のまま続け、タグが届いたら取り直す(scripts/ensure-atlas.ps1 は、HEAD から辿れるいちばん新しいタグの
# リリースを使う)。
# 手順は docs/development.md の「リリースの手順」。
# 失敗したときや作り直すときは、Actions の画面からタグを指定して動かす(workflow_dispatch。タグが要る。同じ名前のファイルは置き換える)。
# atlas.exe には GitHub の artifact attestation(ビルドの来歴。Sigstore で署名され、どのリポジトリ・ワークフロー・コミットで
# 作ったかを示す)も付ける。利用者は gh attestation verify で確かめられる(ensure-atlas.ps1 は gh があれば確かめる。README)。
# 既定の機能だけでビルドする(従量課金の API を直接呼ぶ anthropic-backend は入れない)。
# 外部の Action はコミット SHA で固定する(ci.yml と同じ)。Rust はランナーに入っている rustup で入れる。
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 作り直すリリースのタグ(例 v0.1.0)
        required: true

permissions:
  contents: read

# 同じリリースを 2 回作らないよう、1 本ずつ動かす(後から来たものは、前のものがリリースを作った後に「もうある」で終わる)
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  plan:
    name: 作るリリースを決める
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      # 前のタグとの差を見るので、履歴とタグを全部取る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: 配る中身が前のリリースから変わったかと、次の版
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ -n "$INPUT_TAG" ]; then
            # 作り直す: タグのコミットから、タグの版でビルドする
            if ! [[ "$INPUT_TAG" =~ $semver ]]; then
              echo "::error::タグ $INPUT_TAG が v<x.y.z> の形ではありません"
              exit 1
            fi
            echo "タグ $INPUT_TAG のリリースを作り直します"
            { echo "tag=$INPUT_TAG"; echo "ref=$INPUT_TAG"; echo "build=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 配る atlas.exe に入るもの(git の pathspec。自動の更新も同じファイルを読む。説明はファイルの先頭)
          mapfile -t shipped < <(tr -d '\r' < scripts/release-shipped.txt | grep -vE '^[[:space:]]*(#|$)')
          test "${#shipped[@]}" -gt 0
          latest=$(git tag --list 'v*' | grep -E "$semver" | sort -V | tail -n 1 || true)
          cargo_version=$(awk '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0} s && /^version *=/{gsub(/.*= *"|".*/,"");print;exit}' Cargo.toml)
          test -n "$cargo_version"
          echo "いちばん新しいタグ: ${latest:-(無し)} / Cargo.toml の version: $cargo_version"
          if [ -n "$latest" ]; then
            if ! gh release view "$latest" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::タグ $latest にリリースがありません。Actions の画面からタグ $latest を指定して作り直すか、タグを消してください"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$latest" "$GITHUB_SHA"; then
              # 古いコミットの実行をやり直したときなど。新しいリリースの後に、それより前のコミットからリリースを作らない
              echo "このコミットは、いちばん新しいリリース $latest のコミットを含んでいません。作りません"
              { echo "tag=$latest"; echo "build=false"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git diff --quiet "$latest" "$GITHUB_SHA" -- "${shipped[@]}"; then
              echo "配る中身は $latest から変わっていません。作りません"
              { echo "tag=$latest"; echo "build=false"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$latest から変わった、配るもの(先頭 50 件):"
            git diff --name-only "$latest" "$GITHUB_SHA" -- "${shipped[@]}" | head -n 50
          fi
          # 次の版: Cargo.toml の version のタグがまだ無く、いちばん新しいタグより大きければそれ。そうでなければパッチ版を 1 つ上げる
          tag=""
          if [[ "v$cargo_version" =~ $semver ]] && [ -z "$(git tag --list "v$cargo_version")" ]; then
            if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "${latest#v}" "$cargo_version" | sort -V | tail -n 1)" = "$cargo_version" ]; then
              tag="v$cargo_version"
            fi
          fi
          if [ -z "$tag" ]; then
            if [ -z "$latest" ]; then
              echo "::error::タグがまだ無く、Cargo.toml の version($cargo_version)も x.y.z の形ではありません"
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${latest#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          # 次の版は、まだ無いタグ(タグの無い Cargo.toml の version か、いちばん新しいタグより大きい版)なので、そのタグやリリースが
          # もうあることは無い(リリースの無いタグは、上でいちばん新しいタグとして止める)。前の実行が残した下書きのリリースは、
          # この権限では見えないので、ファイルを付けるジョブが片付ける
          echo "リリース $tag を $GITHUB_SHA から作ります"
          { echo "tag=$tag"; echo "ref=$GITHUB_SHA"; echo "build=true"; } >> "$GITHUB_OUTPUT"

  windows:
    name: atlas.exe(Windows)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    # リリースを作ってファイルを付けるので、このジョブだけ書き込める。id-token と attestations は来歴(attestation)の署名と保存に使う
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Rust を入れる
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
      - run: npm ci
      - run: npm run build:report
      - name: atlas.exe をビルドする
        shell: bash
        env:
          # 画面のテンプレートが無ければ止める。--version に出すコミットはビルドしたもの、版は付けるタグの版
          ATLAS_REQUIRE_TEMPLATE: '1'
        run: |
          ATLAS_BUILD_COMMIT=$(git rev-parse HEAD)
          ATLAS_VERSION=${TAG#v}
          export ATLAS_BUILD_COMMIT ATLAS_VERSION
          cargo build --release --locked -p atlas-cli
          mkdir -p dist
          cp target/release/atlas.exe dist/atlas.exe
          ./dist/atlas.exe --version
          ./dist/atlas.exe --version | grep -q "^atlas ${TAG#v} ("
      - name: sha256 を書く
        shell: bash
        working-directory: dist
        run: |
          sha256sum atlas.exe > atlas.exe.sha256
          cat atlas.exe.sha256
      # ビルドの来歴を atlas.exe に付ける(リポジトリの attestation として保存される。gh attestation verify で確かめる)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/atlas.exe
      - name: リリースに付ける
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          notes="Windows 用の atlas.exe と、その sha256(atlas.exe.sha256)。起動用の .bat が自動で取ってきます。"
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" = "true" ]; then
              # 前の実行が、下書きで作ってファイルを上げている途中で止まった(gh release create は下書きで作り、ファイルを上げてから公開する)。
              # 下書きは利用者に見えず、タグもまだ無い。別のコミットを指しているかもしれないので、消してから作り直す
              echo "前の実行が残した下書きのリリース $TAG を消して、作り直します"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            elif [ "$REF" = "$TAG" ]; then
              # 作り直し(公開してあるリリースのファイルを置き換える)
              gh release upload "$TAG" dist/atlas.exe dist/atlas.exe.sha256 --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            else
              echo "::error::リリース $TAG はもう公開されています。別のコミット($REF)のファイルで置き換えません"
              exit 1
            fi
          fi
          if [ "$REF" = "$TAG" ]; then
            # 作り直し(タグはある)
            gh release create "$TAG" dist/atlas.exe dist/atlas.exe.sha256 --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "$notes"
          else
            # main に入ったコミットにタグを付けて作る。ファイルを付けるときは、下書きで作ってファイルを上げてから公開するので、
            # ファイルの無いリリースを利用者が取りに行くことはない
            gh release create "$TAG" dist/atlas.exe dist/atlas.exe.sha256 --repo "$GITHUB_REPOSITORY" --target "$REF" --title "$TAG" --notes "$notes"
          fi
