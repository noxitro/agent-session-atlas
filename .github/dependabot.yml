# 依存の更新を週 1 回 PR で出す。PR ごとに CI(ci.yml)が回るので、通ったものだけ取り込む。
# npm は minor / patch をまとめて 1 本にし、major(vitest 3 → 5 など)は個別の PR にする。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # svelte-check(4.7.8 時点)は TypeScript 7 単体に未対応(peer は ^5 || ^6)。対応したらこの指定を外す
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
