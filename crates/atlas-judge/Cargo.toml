[package]
name = "atlas-judge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
atlas-core = { version = "0.1.0", path = "../atlas-core" }
atlas-report = { version = "0.1.0", path = "../atlas-report" }
getrandom = "0.4.3"
indexmap = "2.14.2"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3.27.0"
# 従量課金の Anthropic API を直接呼ぶバックエンド(anthropic)だけが使う HTTP クライアント。
# TLS の実装などで依存が増えるので、既定のビルド(起動用の .bat がこの PC でする atlas.exe のビルドも)には入れない(下の anthropic-backend)
ureq = { version = "3.5.2", optional = true }

[features]
# --backend anthropic を使えるようにする。atlas-cli の同じ名前の機能から有効にする
# (cargo build --release -p atlas-cli --features anthropic-backend)
anthropic-backend = ["dep:ureq"]
