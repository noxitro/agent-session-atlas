[package]
name = "atlas-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
atlas-core = { version = "0.1.0", path = "../atlas-core" }
atlas-judge = { version = "0.1.0", path = "../atlas-judge" }
atlas-report = { version = "0.1.0", path = "../atlas-report" }
bytes = "1.12.1"
chrono = "0.4.45"
hex = "0.4.3"
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
indexmap = "2.14.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
unicode-normalization = "0.1.26"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time", "sync", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[[bin]]
name = "atlas"
path = "src/main.rs"

[build-dependencies]
hex = "0.4.3"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
