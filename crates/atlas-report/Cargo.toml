[package]
name = "atlas-report"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
atlas-core = { version = "0.1.0", path = "../atlas-core" }
chrono = "0.4.45"
comrak = { version = "0.59.0", default-features = false }
hex = "0.4.3"
indexmap = "2.14.2"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.11.0"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
