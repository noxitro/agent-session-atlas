# cargo-deny の設定(Rust の依存の検査)。cargo deny check で、既知の脆弱性・ライセンス・重複と版の指定・取得元を見る。
# CI(.github/workflows/ci.yml の cargo-deny)が push と PR ごとに、.github/workflows/deny-schedule.yml が毎週、回す。
# 手元では cargo install cargo-deny --locked で入れて、リポジトリ直下で cargo deny check(docs/development.md の「依存の検査」)。
# 例外(ignore・exceptions・skip)を足すときは、理由と、外せる条件を同じ行のそばに書く。

[graph]
# 機能 anthropic-backend(従量課金の API を直接呼ぶ判定。既定のビルドには入らない)の依存も含めて見る
all-features = true

[advisories]
# RustSec の advisory-db を使う。脆弱性(vulnerability)は設定にかかわらず常に止まる
# 保守されなくなったもの・健全でない(unsound)ものは、直接の依存か推移的な依存かを問わず止める
unmaintained = "all"
unsound = "all"
# crates.io で取り下げられた版も止める(cargo update -p <名前> で上げる)
yanked = "deny"
# 無視する advisory。足すときは { id = "RUSTSEC-…", reason = "…" } の形で理由を書く
ignore = [
  # chrono が保守されなくなった(脆弱性ではない。上げられる版は無い)。atlas は日時の計算と書式にだけ使い、日時の文字列を
  # chrono で読むところは無い(読み取りは jsdate.rs の自前の処理)ので、すぐの害は無い。これで止まったままだとリリースが出ず、
  # 利用者の PC が古い atlas.exe のままになる。外せる条件: chrono を jiff か time に置き換えたとき
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (not a vulnerability, no fixed version); remove after migrating to jiff or time" },
]

[licenses]
# このリポジトリは MIT。配る atlas.exe に入れても MIT と両立する、寛容なライセンスだけを許す
# (コピーレフト(GPL・LGPL など)は許さない。LGPL を選べるクレートは、ほかに許すライセンスを選べるので通る)
allow = [
  "MIT",
  "Apache-2.0",
  # rustix・linux-raw-sys(Linux のときの tempfile の依存)。Apache-2.0 に LLVM の例外を足したもので、制限は増えない
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  # ICU4X(icu_collator など。日本語の並べ替え)と unicode-ident が使う Unicode のデータのライセンス。著作権表示を残せば使える寛容なもの
  "Unicode-3.0",
  # finl_unicode(comrak の依存。Markdown の処理)が同梱する Unicode のデータの、前の版のライセンス。Unicode-3.0 と同じ趣旨の寛容なもの
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.9
exceptions = [
  # webpki-roots は Mozilla のルート証明書の一覧(データ)。機能 anthropic-backend のときだけ入る(既定のビルドには無い)。
  # CDLA-Permissive-2.0 はデータ向けの寛容なライセンスで、表示以外の条件が無い。このクレートだけに許す
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[licenses.private]
# ワークスペースのクレート(publish = false)はライセンスの検査から外す(どれも MIT)
ignore = true

[bans]
# 同じクレートの版が複数あるのは警告だけにする(依存の側の都合で分かれることが多い。増えたら cargo tree -d で確かめる)
multiple-versions = "warn"
# 版を "*" で指定した依存は止める(何が入るか決まらない)。ワークスペースの中の path の依存は除く
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# 依存は crates.io からだけ取る(ほかのレジストリと git の依存は止める)
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
